<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Landing Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        nav {
            background: #333;
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card p {
            padding: 10px;
            color: #555;
        }
    </style>
</head>
<body>

<nav>
    <a href="/user/login">Login</a>
    <a href="/user/signup">Signup</a>
</nav>

<h1>Approved Pictures</h1>

<!-- 🔹 Gallery -->
<div class="gallery">
    <div class="card" th:each="pic : ${pictures}">
        <img th:src="@{${pic.filePath}}" alt="Picture"/>
        <p th:text="${pic.description}"></p>
    </div>
</div>

</body>
</html>
