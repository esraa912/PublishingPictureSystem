<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            padding-bottom: 15px;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card p {
            padding: 10px;
            color: #555;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .actions form {
            display: inline;
        }
        .actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
        }
        .approve {
            background: #4CAF50;
        }
        .reject {
            background: #f44336;
        }
    </style>
</head>
<body>
<h1>Admin - Pending Pictures</h1>

<div class="gallery">
    <div class="card" th:each="pic : ${pictures}">
        <img th:src="@{${pic.filePath}}" alt="Picture"/>
        <p th:text="${pic.description}"></p>
        <div class="actions">
            <form th:action="@{'/admin/approve/' + ${pic.id}}" method="post">
                <button type="submit" class="approve">Approve</button>
            </form>
            <form th:action="@{'/admin/reject/' + ${pic.id}}" method="post">
                <button type="submit" class="reject">Reject</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
