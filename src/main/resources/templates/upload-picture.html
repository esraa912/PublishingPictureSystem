<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Picture</title>
    <style>
        .upload-form {
            width: 400px;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .upload-form label {
            display: block;
            margin-top: 10px;
        }
        .upload-form input, .upload-form textarea, .upload-form button {
            width: 100%;
            margin-top: 5px;
            padding: 10px;
        }
        .upload-form button {
            background: #4CAF50;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .upload-form button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
<!-- 🔹 Upload Form (يظهر لما المستخدم يفتح تاب Upload Picture) -->
<div class="upload-form" th:if="${showUpload}">
    <h2>Upload New Picture</h2>
    <form action="/user/upload" method="post" enctype="multipart/form-data">
        <label for="file">Choose Picture:</label>
        <input type="file" id="file" name="file" accept="image/*" required>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>

        <label for="category">Category:</label>
        <input type="text" id="category" name="category" required>

        <button type="submit">Upload</button>
    </form>
</div>
</body>
</html>
